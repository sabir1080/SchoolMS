<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · SchoolMS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
             font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #111827; }
      .card { max-width: 360px; background: #fff; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
      button { margin-top: 12px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; padding: 10px 16px; font-size: 14px; }
      @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #e5e7eb; } .card { background: #111827; } }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1 style="font-size: 20px">You are offline</h1>
      <p style="font-size: 14px; color: #6b7280">Check your internet connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
