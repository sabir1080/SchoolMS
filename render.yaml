# Render Blueprint. Database is hosted on Neon (free), so only the API costs money
# once it is moved off the free plan. The frontend is a free Static Site.
services:
  - type: web
    name: schoolms-api
    runtime: python
    plan: free  # change to "starter" (~$7/month) before real institutes use it
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      # Neon connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Frontend URL, e.g. https://schoolms-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPERADMIN_USERNAME
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false

  - type: web
    name: schoolms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      # Backend URL, e.g. https://schoolms-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_CONTACT
        sync: false
